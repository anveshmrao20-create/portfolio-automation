name: ETF Daily Automation

on:
  schedule:
  # 1. 2:00 PM IST Monday-Friday
  - cron: "30 8 * * 1-5"
  workflow_dispatch:

jobs:
  run-etf-daily:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: pip install -r requirements.txt

      - name: Setup credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDS }}" | base64 --decode > credentials.json

      - name: Run ETF historical
        run: python etf_historical.py

      - name: Run ETF signals
        run: python etf_signals.py
